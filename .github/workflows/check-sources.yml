# Checks that every pack's live sources can be opened and still contain the expected text,
# from a machine with open internet. Results are committed to src/packs/source-status.json
# and rendered into each pack ("自動檢查").
name: Check pack sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *' # daily, 05:17 Taiwan time (runs on the default branch only)
  push:
    paths:
      - 'src/packs/content/**'
      - 'src/packs/ids.ts'
      - 'scripts/check-sources.ts'
      - '.github/workflows/check-sources.yml'

permissions:
  contents: write

concurrency:
  group: check-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:sources
      - run: npm run packs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/packs/source-status.json public
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update pack source check results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          npm run packs
          git add public && (git diff --cached --quiet || git commit -m "Regenerate packs")
          git push origin "HEAD:${GITHUB_REF_NAME}"
